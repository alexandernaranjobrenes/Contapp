upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 120
max_input_vars = 5000

; Ajusta a tu zona horaria si la app la necesita (ej. America/Costa_Rica, America/Mexico_City).
date.timezone = UTC

; OPcache: sin esto, PHP recompila cada archivo (Composer autoload de Laravel,
; ~cientos de clases) en CADA request, y en este entorno ese costo se agrava
; porque el código corre desde un bind mount de Docker (.:/var/www/html, ver
; docker-compose.yml) en vez de un filesystem nativo. validate_timestamps=1 +
; revalidate_freq=1 (no 0): sigue siendo desarrollo activo, así que un archivo
; editado se recompila casi al instante, pero todo lo que NO cambió entre
; requests se sirve desde memoria en vez de releerse/recompilarse del disco lento.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 1
opcache.save_comments = 1

; Reduce las llamadas stat()/resolución de rutas repetidas contra el mismo
; filesystem lento del bind mount.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
