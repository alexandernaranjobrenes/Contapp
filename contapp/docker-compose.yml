# El nombre del proyecto queda FIJO acá y no se deriva del nombre de la
# carpeta, que es el comportamiento por defecto de Compose.
#
# De este nombre salen los prefijos de los volúmenes: la base de datos vive
# en `contapp_contapp_db_data`. Si el proyecto se clona en una carpeta con
# otro nombre —al sacarlo de OneDrive, por ejemplo— Compose crearía volúmenes
# nuevos y vacíos, y parecería que la base se borró. El volumen viejo seguiría
# existiendo, pero nadie lo sabría mirando la aplicación.
name: contapp

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contapp_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - contapp_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    networks:
      - contapp

  # Las tareas programadas de routes/console.php: el tipo de cambio del BCCR
  # de cada día, los registros programados. `schedule:work` hace lo que el
  # cron de un servidor: correr el programador cada minuto.
  #
  # Usa la imagen de `app` (contapp-app, la que construye ese servicio) y no
  # su entrypoint: las migraciones y la caché de rutas ya las hace `app` al
  # arrancar, y hacerlas dos veces a la vez se pisaría.
  scheduler:
    image: contapp-app
    container_name: contapp_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    entrypoint: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - contapp_vendor:/var/www/html/vendor
    depends_on:
      - app
    networks:
      - contapp

  # La cola «backups»: importar un respaldo (CLAUDE.md secc. 37) puede
  # tardar, y corre aparte de la pantalla. Solo esa cola: lo demás que se
  # encola va a «default», que atiende queue-default.
  queue:
    image: contapp-app
    container_name: contapp_queue
    restart: unless-stopped
    working_dir: /var/www/html
    entrypoint: ["php", "artisan", "queue:work", "--queue=backups", "--tries=1", "--timeout=3600", "--sleep=3", "--memory=512"]
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - contapp_vendor:/var/www/html/vendor
    depends_on:
      - app
    networks:
      - contapp

  # La cola «default»: lo que se encola sin una cola propia, hoy los
  # comprobantes de pago por correo (PayslipController → PayslipMail). Sin
  # este worker quedaban en la tabla jobs y nunca salían. Aparte de
  # «backups», para que un respaldo grande no los detenga una hora. Un correo
  # que falla se reintenta dos veces, con un minuto entre cada intento. El
  # tiempo máximo queda por debajo del retry_after de la cola (90 s,
  # config/queue.php): si no, un trabajo lento podría correr dos veces.
  queue-default:
    image: contapp-app
    container_name: contapp_queue_default
    restart: unless-stopped
    working_dir: /var/www/html
    entrypoint: ["php", "artisan", "queue:work", "--queue=default", "--tries=3", "--backoff=60", "--timeout=80", "--sleep=3", "--memory=256"]
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - contapp_vendor:/var/www/html/vendor
    depends_on:
      - app
    networks:
      - contapp

  # La cola «hacienda» (CLAUDE.md secc. 38): enviar los comprobantes
  # electrónicos, consultar su estado y entregarlos al cliente. Aparte de
  # «backups», que con un respaldo grande puede ocupar su worker una hora: un
  # comprobante no puede esperar eso. Lo que toca hacer lo despacha cada minuto
  # el servicio `scheduler` (pivox:hacienda-sync).
  queue-hacienda:
    image: contapp-app
    container_name: contapp_queue_hacienda
    restart: unless-stopped
    working_dir: /var/www/html
    entrypoint: ["php", "artisan", "queue:work", "--queue=hacienda", "--tries=1", "--timeout=300", "--sleep=3", "--memory=256"]
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - contapp_vendor:/var/www/html/vendor
    depends_on:
      - app
    networks:
      - contapp

  nginx:
    image: nginx:stable-alpine
    container_name: contapp_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - contapp

  db:
    image: mysql:8.0
    container_name: contapp_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - contapp_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - contapp

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: contapp_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - contapp

  node:
    image: node:22-alpine
    container_name: contapp_node
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev"
    volumes:
      - .:/var/www/html
      - contapp_node_modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    networks:
      - contapp

networks:
  contapp:
    driver: bridge

volumes:
  contapp_db_data:
    driver: local
  contapp_vendor:
    driver: local
  contapp_node_modules:
    driver: local
