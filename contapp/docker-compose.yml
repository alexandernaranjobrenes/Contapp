# El nombre del proyecto queda FIJO acá y no se deriva del nombre de la
# carpeta, que es el comportamiento por defecto de Compose.
#
# De este nombre salen los prefijos de los volúmenes: la base de datos vive
# en `contapp_contapp_db_data`. Si el proyecto se clona en una carpeta con
# otro nombre —al sacarlo de OneDrive, por ejemplo— Compose crearía volúmenes
# nuevos y vacíos, y parecería que la base se borró. El volumen viejo seguiría
# existiendo, pero nadie lo sabría mirando la aplicación.
name: contapp

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contapp_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - contapp_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    networks:
      - contapp

  nginx:
    image: nginx:stable-alpine
    container_name: contapp_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - contapp

  db:
    image: mysql:8.0
    container_name: contapp_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - contapp_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - contapp

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: contapp_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - contapp

  node:
    image: node:22-alpine
    container_name: contapp_node
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev"
    volumes:
      - .:/var/www/html
      - contapp_node_modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    networks:
      - contapp

networks:
  contapp:
    driver: bridge

volumes:
  contapp_db_data:
    driver: local
  contapp_vendor:
    driver: local
  contapp_node_modules:
    driver: local
